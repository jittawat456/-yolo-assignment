services:
  - type: web
    name: yolo-animal-detection
    runtime: docker
    plan: free             # 512 MB; deployed on Free plan (Starter requires a payment method)
    region: singapore
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: YOLO_CONFIG_DIR
        value: /tmp/Ultralytics
