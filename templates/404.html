<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | YOLO Animal Detection</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at 10% 0%, #e8f0ff 0, transparent 32rem), #f5f8fc;
      color: #14213d; font-family: "Segoe UI", system-ui, Arial, sans-serif;
    }
    .box {
      background: #fff; border: 1px solid #e3eaf3; border-radius: 18px;
      box-shadow: 0 12px 34px rgba(23,43,77,.07); padding: 38px; text-align: center;
      max-width: 420px; margin: 20px;
    }
    .mark { font-size: 42px; color: #2563eb; }
    h1 { font-size: 23px; margin: 8px 0 6px; letter-spacing: -.6px; }
    p { color: #61708a; font-size: 13px; margin: 0 0 20px; }
    a {
      display: inline-block; background: #2563eb; color: #fff; text-decoration: none;
      padding: 11px 18px; border-radius: 10px; font-size: 13px; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true">◎</div>
    <h1>Page not found</h1>
    <p>The page you requested does not exist. Return to the detection dashboard to continue.</p>
    <a href="/">Back to dashboard</a>
  </div>
</body>
</html>
